name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Note: You mentioned 'needs: test', so ensure you have a 'test' job defined 
  # or remove that line if testing is handled within the build steps.
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          # Convert repository name to lowercase for GHCR compatibility
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .
          # Store the name for subsequent steps
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Test Docker image
        run: |
          docker run -d -p 5000:5000 --name test-container ${{ env.IMAGE_NAME }}:${{ github.sha }}
          sleep 5
          if curl -f http://localhost:5000/health; then
            echo "Health check passed"
          else
            echo "Health check FAILED"
            docker logs test-container
            exit 1
          fi

          docker stop test-container
          docker rm test-container

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest
